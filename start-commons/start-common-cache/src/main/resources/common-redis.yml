# ===================================================================
# 缓存 - 公共配置
# ===================================================================
# 说明：Redis 缓存 + Lock4j 分布式锁配置
# ===================================================================

start:
  cache:
    scan-batch-size: 30
    redis:
      cache-null-values: true  # 允许缓存空值，防止缓存穿透

lock4j:
  acquire-timeout: 3000 # 默认值3s，可不设置
  expire: 30000 # 默认值30s，可不设置
  lock-key-prefix: lock4j # 锁key前缀，默认值lock4j，可不设置
