mybatis-flex:
  audit_enable: false
  sql_print: false
  global-config:
    logic-delete-column: deleted
    normal-value-of-logic-delete: false
    deleted-value-of-logic-delete: true

spring:
  datasource:
    druid:
      # 连接池
      initial-size: 5
      min-idle: 10
      max-active: 20
      max-wait: 60000

      # 保活
      keep-alive: true
      keep-alive-between-time-millis: 120000

      # 连接验证
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

      # 连接回收
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000

      # 连接泄漏检测
      remove-abandoned: true
      remove-abandoned-timeout: 180
      log-abandoned: true

      # PreparedStatement 缓存（动态SQL多可关闭）
      pool-prepared-statements: false

      # 过滤器
      filters: stat,wall,slf4j

      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          enabled: true

      # 监控
      web-stat-filter:
        enabled: true
        profile-enable: true
      stat-view-servlet:
        enabled: true
        allow: 127.0.0.1
        login-username: admin
        login-password: ${DRUID_PASSWORD:admin}
        reset-enable: false

      # 预热
      init-connection-sqls: SELECT 1