# ===================================================================
# Web 层 - 公共配置
# ===================================================================
# 说明：XSS 防护、CORS 等 Web 层公共配置
# ===================================================================

start:
  xss:
    enable: true
    excludePaths:
      - /api/v1/user/login
      - /api/v1/user/register
      - /api/v1/user/logout
