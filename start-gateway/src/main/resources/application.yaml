spring:
  application:
    name: start-gateway
  profiles:
    active: @profiles.active@  # 使用Maven过滤 激活对应环境的配置
  config:
    import:
      - optional:application-${spring.profiles.active}.yaml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml # 加载【Nacos】的配置
  main:
    allow-circular-references: true # 允许循环依赖
  cloud:
    gateway:
      server:
        webflux:
          routes:
            ## system-server 服务
            - id: system-admin-api # 路由的编号
              uri: lb://system-service
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/api/system/**
              filters:
                - StripPrefix=2  # 去掉前两级路径 /api/system/ 文档:https://spring-doc.muziseo.cn/spring-cloud/gateway/filters/strip-prefix.html
            - id: demo-admin-api
              uri: lb://demo-service
              predicates:
                - Path=/api/demo/**
              filters:
                - StripPrefix=2


logging:
  level:
    com.alibaba.nacos: WARN
    com.alibaba.nacos.client.config.impl.ClientWorker: ERROR
    com.alibaba.nacos.client.naming: WARN
server:
  port: 48080

# Sa-Token 配置（网关层只校验 JWT，不查 Redis）
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # jwt秘钥
  jwt-secret-key: abcdefghijklmnopqrstuvwxyz
  # 关闭无状态模式下不支持的活跃度校验
  dynamic-active-timeout: false
  active-timeout: -1
  # 允许从 请求参数 读取 token
  is-read-body: true
  # 允许从 header 读取 token
  is-read-header: true
  # 关闭 cookie 鉴权 从根源杜绝 csrf 漏洞风险
  is-read-cookie: false
  # token前缀
  token-prefix: Bearer
  timeout: -1

# 白名单配置（不需要登录认证的路径）
gateway:
  auth:
    white-paths:
      - /auth/login
      - /auth/captcha
    white-prefixes:
      - /swagger-ui
      - /v3/api-docs
      - /actuator
  allowed-origins: "http://localhost:9000,http://localhost:5173,http://127.0.0.1:3000"
  allowed-methods: "*"
  allowed-headers: "*"
  exposed-headers: "Authorization, Content-Disposition, X-Request-ID"
  allow-credentials: true
  max-age: "3600"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: system
        url: /api/system/v3/api-docs
      - name: demo
        url: /api/demo/v3/api-docs