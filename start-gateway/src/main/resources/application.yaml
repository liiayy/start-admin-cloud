spring:
  application:
    name: start-gateway
  profiles:
    active: @profiles.active@  # 使用Maven过滤 激活对应环境的配置
  config:
    import:
      - optional:application-${spring.profiles.active}.yaml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml # 加载【Nacos】的配置
  main:
    allow-circular-references: true # 允许循环依赖
  cloud:
    gateway:
      server:
        webflux:
          routes:
            ## system-server 服务
            - id: system-admin-api # 路由的编号
              uri: lb://system-service
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/api/system/**
              filters:
                - StripPrefix=2  # 去掉前两级路径 /api/system/ 文档:https://spring-doc.muziseo.cn/spring-cloud/gateway/filters/strip-prefix.html
            - id: demo-admin-api
              uri: lb://demo-service
              predicates:
                - Path=/api/demo/**
              filters:
                - StripPrefix=2


logging:
  level:
    com.alibaba.nacos: WARN
    com.alibaba.nacos.client.config.impl.ClientWorker: ERROR
    com.alibaba.nacos.client.naming: WARN
server:
  port: 48080

cors:
  allowed-origins: "http://localhost:9000,http://localhost:5173,http://127.0.0.1:3000"
  allowed-methods: "GET, POST, PUT, DELETE, OPTIONS"
  allowed-headers: "Origin, Content-Type, Accept, Authorization, X-Requested-With"
  exposed-headers: "Authorization, Content-Disposition, X-Request-ID"
  allow-credentials: true
  max-age: "3600"

# 限流配置
gateway:
  ratelimit:
    enabled: true
    redis:
      host: 192.168.100.20
      port: 6379
      password: WeEvBhLapEHJMG4JFfFG
      database: 0
      timeout: 10000
    rules:
      default:
        pattern: /**
        window: 60
        limit: 100
        enabled: true
      api:
        pattern: /api/**
        window: 60
        limit: 200
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: system
        url: /api/system/v3/api-docs
      - name: demo
        url: /api/demo/v3/api-docs