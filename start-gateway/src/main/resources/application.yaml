# ===================================================================
# 网关服务 - 主配置文件
# ===================================================================
# 说明：API 网关，负责请求路由、认证鉴权、跨域处理
# ===================================================================

server:
  port: 48080

spring:
  application:
    name: start-gateway
  profiles:
    active: @profiles.active@  # 使用Maven过滤 激活对应环境的配置
  config:
    import:
      - optional:application-${spring.profiles.active}.yaml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml
  main:
    allow-circular-references: true # 允许循环依赖
  cloud:
    loadbalancer:
      cache:
        enabled: true
        ttl: 10s
    gateway:
      server:
        webflux:
          routes:
            ## WebSocket 路由（必须在 HTTP 路由之前）
                    - id: system-websocket
                      uri: lb:ws://system-service
                      predicates:
                        - Path=/api/admin/system/websocket/**
                      filters:
                        - StripPrefix=1
                    ## system-server 服务
                    - id: system-admin-api
                      uri: lb://system-service
                      predicates:
                        - Path=/api/admin/system/**
                      filters:
                        - StripPrefix=1
                    - id: system-app-api
                      uri: lb://system-service
                      predicates:
                        - Path=/api/app/system/**
                      filters:
                        - StripPrefix=1
                    ## demo-server 服务
                    - id: demo-admin-api
                      uri: lb://demo-service
                      predicates:
                        - Path=/api/admin/demo/**
                      filters:
                        - StripPrefix=1
                    ## python-service 服务（异构微服务）
                    - id: python-admin-api
                      uri: lb://start-python-demo
                      predicates:
                        - Path=/api/admin/python/**
                      filters:
                        - StripPrefix=1

# ===================================================================
# Sa-Token 认证配置（网关层只校验 JWT，不查 Redis）
# ===================================================================
sa-token:
  token-name: Authorization
  is-concurrent: true
  is-share: false
  jwt-secret-key: ${sa-token.jwt-secret-key:start-admin-cloud-default-secret-key-32bits}
  dynamic-active-timeout: false
  active-timeout: -1
  is-read-body: true
  is-read-header: true
  is-read-cookie: false
  token-prefix: Bearer
  timeout: -1

# ===================================================================
# 网关业务配置
# ===================================================================
gateway:
  auth:
    white-paths:
      - /api/admin/system/auth/login
      - /api/admin/system/auth/captcha
      - /api/admin/system/config/value
      - /api/admin/system/config/list-values
    white-prefixes:
      - /api/admin/system/oss/download
      - /api/admin/system/websocket
      - /api/admin/system/social/auth
      - /api/admin/system/social/callback
      - /swagger-ui
      - /v3/api-docs
      - /actuator
    white-suffixes:
      - /v3/api-docs
  allowed-origins: ${gateway.allowed-origins:*}
  allowed-methods: "*"
  allowed-headers: "*"
  exposed-headers: "Authorization, Content-Disposition, X-Request-ID"
  allow-credentials: true
  max-age: "3600"

# ===================================================================
# 接口文档配置
# ===================================================================
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: gateway
        url: /v3/api-docs

# ===================================================================
# 日志级别配置
# ===================================================================
logging:
  level:
    com.alibaba.nacos: WARN
    com.alibaba.nacos.client.config.impl.ClientWorker: ERROR
    com.alibaba.nacos.client.naming: WARN