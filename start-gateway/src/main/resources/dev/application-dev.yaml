spring:
  cloud:
    gateway:
      server:
        webflux:
          # 路由发现配置
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

    nacos:
      discovery:
        server-addr: 192.168.100.20:8848
        namespace: public
        group: DEFAULT_GROUP
      config:
        server-addr: 192.168.100.20:8848
        file-extension: yaml
        namespace: public
        group: DEFAULT_GROUP

# 安全加固配置 (开发环境)
sa-token:
  # 开发环境专用强密钥
  jwt-secret-key: dev-secret-key-start-admin-cloud-2026-04-27
 
gateway:
  # 开发环境允许的跨域源
  allowed-origins: "http://localhost:9000,http://localhost:5173,http://127.0.0.1:3000"
