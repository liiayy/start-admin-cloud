# ===================================================================
# 示例服务2 - 主配置文件
# ===================================================================
# 说明：第二个演示服务，用于展示 Seata 分布式事务等功能
# ===================================================================

spring:
  application:
    name: demo2-service
  profiles:
    active: @profiles.active@
  config:
    import:
      - optional:application-${spring.profiles.active}.yaml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml
  threads:
    virtual:
      enabled: true

server:
  port: 58092