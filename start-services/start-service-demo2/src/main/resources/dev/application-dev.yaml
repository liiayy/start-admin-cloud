# ===================================================================
# 示例服务2 - 开发环境配置
# ===================================================================

spring:
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.100.20:8848
        namespace: public
        group: DEFAULT_GROUP
      config:
        server-addr: 192.168.100.20:8848
        file-extension: yaml
        namespace: public
        group: DEFAULT_GROUP
    sentinel:
      transport:
        dashboard: 192.168.100.20:8858

seata:
  application-name: ${spring.application.name}
  tx-service-group: my_test_tx_group
  data-source-proxy-mode: AT
  registry:
    type: nacos
    nacos:
      server-addr: 192.168.100.20:8848
      namespace:
      group: DEFAULT_GROUP
      application: seata-server
  config:
    type: nacos
    nacos:
      server-addr: 192.168.100.20:8848
      namespace: seata-server
      group: DEFAULT_GROUP
      data-id: seataServer.properties

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.mybatis: DEBUG