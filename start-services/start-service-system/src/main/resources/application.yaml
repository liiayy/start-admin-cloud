# ===================================================================
# 系统服务 - 主配置文件
# ===================================================================
# 说明：系统微服务的主配置入口，通过Maven Profile切换不同环境配置
# 作者：木子软件
# ===================================================================

spring:
  application:
    name: system-service
  profiles:
    # 使用Maven过滤激活对应环境的配置：dev/test/prod
    active: @profiles.active@
  config:
    import:
      # 加载环境特定的配置文件
      - optional:application-${spring.profiles.active}.yaml
      # 加载Nacos配置中心的配置
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml

server:
  # 系统服务端口
  port: 58081
