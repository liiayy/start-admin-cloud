# ===================================================================
# 系统服务 - 主配置文件
# ===================================================================
# 说明：系统管理微服务，包含用户、角色、菜单、字典等核心功能
# ===================================================================

server:
  port: 58081

spring:
  application:
    name: system-service
  profiles:
    active: @profiles.active@
  config:
    import:
      - optional:application-${spring.profiles.active}.yaml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
seata:
  client:
    undo:
      log-serialization: fastjson

# ===================================================================
# 业务定制配置
# ===================================================================
start:
  oss:
    max-size: 20971520 # 最大上传大小（字节），当前设为 20MB
    forbidden-suffix: # 禁止上传的后缀
      - jsp
      - php
      - sh
      - exe
      - bat
      - jspx

# ===================================================================
# WebSocket 实时通讯配置
# ===================================================================
websocket:
  enabled: true
  path: /admin/system/websocket
  allowed-origins: "*"

# ===================================================================
# 接口文档配置
# ===================================================================
springdoc:
  api-docs:
    path: /admin/system/v3/api-docs
