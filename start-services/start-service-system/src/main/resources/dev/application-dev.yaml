spring:
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.100.20:8848
        namespace: public
        group: DEFAULT_GROUP
      config:
        server-addr: 192.168.100.20:8848
        file-extension: yaml
        namespace: public
        group: DEFAULT_GROUP
    sentinel:
      transport:
        dashboard: 192.168.100.20:8858
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    # --- 修改开始 ---
    # 1. 修改驱动类
    driver-class-name: org.postgresql.Driver

    # 2. 修改 URL (注意: 端口从 3306 改为 5432，IP 请确认是否正确)
    #    去掉了 rewriteBatchedStatements (PG 不支持，但 PG 的 batch 性能原本就很好)
    #    去掉了 allowMultiQueries (PG 原生支持分号;执行多语句，无需参数)
    url: jdbc:postgresql://192.168.100.20:5432/start-admin-system?autoReconnect=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai

    username: root  # 请确认你的 PG 用户名 (之前配置的是 wego_admin)
    password: root
    # --- 修改结束 ---

    # Druid 配置
    druid:
      # 连接池配置
      initial-size: 5
      min-idle: 10
      max-active: 20
      max-wait: 60000

      # 连接测试
      # PG 推荐使用 SELECT 1 或 SELECT NOW()
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

      # 连接保持
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 600000
      max-evictable-idle-time-millis: 1800000

      # PreparedStatement 缓存
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

      web-stat-filter:
        enabled: true

      stat-view-servlet:
        enabled: true
        allow: # 设置白名单
        url-pattern: /druid/*
        login-username: # 控制台管理用户名
        login-password: # 控制台管理密码

      # 过滤器
      filters: stat,wall,slf4j

      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
        wall:
          enabled: true
          config:
          # --- 删除了 delete-where-none-check (这是 MySQL 特有的，PG 不适用) ---
          # PG 的 Wall 模块默认配置已足够安全

# 日志文件配置 (通常不需要变动)
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.mybatis: DEBUG
